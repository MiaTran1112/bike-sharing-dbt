name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test CI
    runs-on: ubuntu-latest

    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number || github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download CSV and load DuckDB
        run: python scripts/load_raw.py

      - name: Build models and run tests
        run: dbt build --profiles-dir . --target ci
