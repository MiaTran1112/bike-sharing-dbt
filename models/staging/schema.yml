version: 2

models:
  - name: stg_bike_daily
    description: "One row per day, with typed and renamed fields."
    columns:
      - name: day_id
        data_tests:
          - unique
          - not_null

      - name: rental_date
        data_tests:
          - unique
          - not_null

      - name: total_rentals
        data_tests:
          - not_null

      - name: casual_rentals
        data_tests:
          - not_null

      - name: registered_rentals
        data_tests:
          - not_null

      - name: season_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: weather_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
